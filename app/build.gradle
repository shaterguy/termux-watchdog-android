plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaterguy.termuxwatchdog'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shaterguy.termuxwatchdog'
        minSdk 26
        targetSdk 36
        versionCode 100002
        versionName '0.1.0-dev2'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            debuggable false
            resValue 'string', 'app_name', 'Termux Watchdog TEST'
        }
        release {
            resValue 'string', 'app_name', 'Termux Watchdog'
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
