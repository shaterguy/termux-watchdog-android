plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaterguy.termuxwatchdog'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shaterguy.termuxwatchdog'
        minSdk 26
        targetSdk 36
        versionCode 100001
        versionName '0.1.0-dev1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
