                      'run_id': RUN, 'job_id': JOB, 'artifact_id': ARTIFACT,
                      'producer_whole_run_completion_required': False,
                      'archive_sha256': ZIP_SHA, 'cache_policy': policy}
          
          def payload(root, helper):
              root = Path(root)
              assert root.is_dir() and not root.is_symlink()
              assert {p.name for p in root.iterdir()} == set(FILES)
