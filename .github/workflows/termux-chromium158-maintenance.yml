              'x11-packages/chromium-host-tools/build.sh': 'd190cdd941a842b6236c7b7ef52af916e09636126d4e57ffda2bb2c6c53c221e',
          }
          GN_LINE = '\tgn gen $TERMUX_PKG_BUILDDIR/out/Release\n'
          GN_REPLACEMENT = '''\t# Diagnose the exact Chromium DEPS Python before GN, without a broad system-Python substitution.
          \tlocal _maintenance_diag="$TERMUX_SCRIPTDIR/output/maintenance-diagnostics/$TERMUX_PKG_NAME"
          \ttest "$TERMUX_PKG_MAKE_PROCESSES" -eq 4
          \t/usr/bin/python3 "$TERMUX_SCRIPTDIR/maintenance/chromium158/host-python-preflight.py" \\
          \t\t"$TERMUX_PKG_SRCDIR" "$TERMUX_PKG_CACHEDIR" "$TERMUX_PKG_CACHEDIR/depot_tools/cipd" \\
          \t\t"$_maintenance_diag" "$TERMUX_PKG_BUILDDIR/out/Release"
          \tlocal _maintenance_python
          \t_maintenance_python="$(cat "$_maintenance_diag/selected-python.path")"
          \tprintf 'ninja_parallel_jobs=%s\\n' "$TERMUX_PKG_MAKE_PROCESSES" | tee "$_maintenance_diag/ninja-parallelism.txt"
          \t# Chromium's supported compiler wrapper covers the host and target C/C++ toolchains.
          \tprintf '\\ncc_wrapper = "/usr/bin/ccache"\\n' >> "$TERMUX_PKG_BUILDDIR/out/Release/args.gn"
          \tgn gen "$TERMUX_PKG_BUILDDIR/out/Release" --script-executable="$_maintenance_python"
          \tcp "$TERMUX_PKG_BUILDDIR/out/Release/args.gn" "$_maintenance_diag/args.gn"
          \tgrep -R -F --include=toolchain.ninja '/usr/bin/ccache' "$TERMUX_PKG_BUILDDIR/out/Release" > "$_maintenance_diag/ccache-generated-commands.txt"
          \ttest -s "$_maintenance_diag/ccache-generated-commands.txt"
