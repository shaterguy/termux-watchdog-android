                                old_cache_sizes=[c['size_in_bytes'] for c in matches],
                                save_new_cache=not matches)
              except Exception as error:
                  policy['lookup_error_type'] = type(error).__name__
              (out / 'browser-cache-policy.json').write_text(json.dumps(policy, indent=2) + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('save_new_cache=' + str(policy['save_new_cache']).lower() + '\n')
