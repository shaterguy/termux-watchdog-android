          # Run only inside the isolated, fixed Termux package-builder container.
          set -euo pipefail
          cd /home/builder/termux-packages
          stage=$1
          case "$stage" in
            host-tools) package=chromium-host-tools ;;
            browser) package=chromium ;;
            *) exit 2 ;;
          esac
          mkdir -p output/maintenance-diagnostics output/delivery
          export CCACHE_DIR="$PWD/maintenance-ccache"
          export CCACHE_MAXSIZE=1900MB
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR=/home/builder
          mkdir -p "$CCACHE_DIR"
          test "$(command -v ccache)" = /usr/bin/ccache
          ccache --version > output/maintenance-diagnostics/ccache-version.txt
          ccache --show-config > output/maintenance-diagnostics/ccache-config.txt
          ccache --show-stats --verbose > output/maintenance-diagnostics/ccache-before.txt
          # Each stage uses one immutable 2GB Actions cache. On a hit, avoid evicting
          # its useful entries while recompiling a source tree larger than the cache.
          if test "${NATIVE_CCACHE_RESTORED:-}" = true; then export CCACHE_READONLY=1; fi
          printf '%s\n' "${NATIVE_CCACHE_RESTORED:-false}" > output/maintenance-diagnostics/ccache-restored.txt
          test "$(git rev-parse HEAD)" = 07f9482c02535417719d7f6398f649d4bc176a1c
          /usr/bin/python3 maintenance-inputs/apply-recovery.py "$PWD" > output/maintenance-diagnostics/source-patch.json
          git diff --check
          git diff -- x11-packages/chromium/build.sh x11-packages/chromium-host-tools/build.sh > output/maintenance-diagnostics/recipes.patch
          dpkg --validate-version '158.0.8127.36-0~termuxlocal1'
          dpkg --compare-versions '157.0.8103.78' lt '158.0.8127.36-0~termuxlocal1'
          dpkg --compare-versions '158.0.8127.36-0~termuxlocal1' lt '158.0.8127.36'
          dpkg --compare-versions '158.0.8127.36-0~termuxlocal1' lt '158.0.8127.36-1'
          TERMUX_ARCH=aarch64 bash scripts/build/termux_extract_dep_info.sh "$package" "$PWD/x11-packages/$package" > output/maintenance-diagnostics/requested-package.txt
          test "$(cat output/maintenance-diagnostics/requested-package.txt)" = 'aarch64 158.0.8127.36-0~termuxlocal1 158.0.8127.36-0~termuxlocal1 true'
          if test "$stage" = browser; then
            /usr/bin/python3 - <<'PY'
          import hashlib,json,subprocess
