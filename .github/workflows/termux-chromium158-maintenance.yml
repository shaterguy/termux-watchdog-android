          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('output/host-tools-input')
          m=json.loads((root/'manifest.json').read_text())
          expected='chromium-host-tools_158.0.8127.36-0~termuxlocal1_aarch64.deb'
          assert m['filename']==expected and m['package']=={'package':'chromium-host-tools','version':'158.0.8127.36-0~termuxlocal1','architecture':'aarch64'}
          with (root/expected).open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==m['deb_sha256']
