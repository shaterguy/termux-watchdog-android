                  with path.open('rb') as stream:
                      actual = (info.st_size, hashlib.file_digest(stream, 'sha256').hexdigest())
                  assert actual == expected, {'unexpected_input': name, 'actual': actual}
                  records[name] = {'bytes': actual[0], 'sha256': actual[1]}
              spec = importlib.util.spec_from_file_location('package_manifest', helper)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              manifest = json.loads((root / 'manifest.json').read_text())
              assert manifest['filename'] == DEB and manifest['source_commit'] == '07f9482c02535417719d7f6398f649d4bc176a1c'
              assert manifest['package'] == {'package': 'chromium-host-tools', 'version': '158.0.8127.36-0~termuxlocal1', 'architecture': 'aarch64'}
              assert module.metadata(root / DEB) == manifest['package']
              assert module.payload(root / DEB) == manifest['payload']
              assert len(manifest['payload']) == 31
