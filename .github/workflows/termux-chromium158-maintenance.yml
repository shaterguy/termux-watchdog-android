          NEW_CACHE = 'native-chromium158-07f9482c-e2de051a-browser-components-17a197a1-ccache-v1'
          
          def api(path):
              request = Request('https://api.github.com/repos/' + REPO + path,
                                headers={'Accept': 'application/vnd.github+json',
                                         'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                         'X-GitHub-Api-Version': '2022-11-28',
                                         'User-Agent': 'chromium158-maintenance-verifier'})
              with urlopen(request, timeout=45) as response:
                  assert response.status == 200
                  return json.load(response)
          
          def metadata(out):
              out = Path(out)
              artifact = api('/actions/artifacts/' + str(ARTIFACT))
              job = api('/actions/jobs/' + str(JOB))
              assert artifact['id'] == ARTIFACT and artifact['name'] == 'chromium158-host-tools-' + str(RUN)
              assert artifact['size_in_bytes'] == 57645102 and artifact['expired'] is False
              assert artifact['digest'] == 'sha256:' + ZIP_SHA
              assert artifact['workflow_run']['id'] == RUN and artifact['workflow_run']['head_sha'] == HEAD
              assert job['id'] == JOB and job['run_id'] == RUN and job['name'] == 'host-tools'
              assert job['head_sha'] == HEAD and job['status'] == 'completed' and job['conclusion'] == 'success'
              out.mkdir(parents=True, exist_ok=True)
              (out / 'host-tools-producer-artifact.json').write_text(json.dumps(artifact, indent=2) + '\n')
              (out / 'host-tools-producer-job.json').write_text(json.dumps(job, indent=2) + '\n')
