              # It disables new cache publication so a transient restore failure cannot
              # create a second browser snapshot in addition to the existing 2GB one.
              policy = {'old_cache_key': OLD_CACHE, 'new_cache_key': NEW_CACHE,
                        'metadata_lookup_succeeded': False, 'save_new_cache': False,
                        'native_maximum_logical_cache_bytes': 4000000000}
              try:
