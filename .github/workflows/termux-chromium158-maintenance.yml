                      'producer_run_id': RUN, 'producer_artifact_id': ARTIFACT,
                      'files': records, 'payload_entries': 31,
                      'mixed_host_and_target_elf_architectures_allowed': True}
          
          if __name__ == '__main__':
              if len(sys.argv) == 3 and sys.argv[1] == 'metadata':
