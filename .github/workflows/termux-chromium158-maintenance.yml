          DEPOT_PINNED = '''\t\tgit init "$TERMUX_PKG_CACHEDIR/depot_tools"
          \t\tgit -C "$TERMUX_PKG_CACHEDIR/depot_tools" remote add origin https://chromium.googlesource.com/chromium/tools/depot_tools.git
          \t\tgit -C "$TERMUX_PKG_CACHEDIR/depot_tools" fetch --depth 1 origin ec77017fb3e090ff02bffb9c6980ebcdd3006ddc
          \t\tgit -C "$TERMUX_PKG_CACHEDIR/depot_tools" checkout --detach FETCH_HEAD
