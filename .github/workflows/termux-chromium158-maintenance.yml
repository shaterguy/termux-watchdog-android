          BASE = '07f9482c02535417719d7f6398f649d4bc176a1c'
          OFFICIAL = '67978763c9ff3a0179035f38a623b77b43d856f7'
          PATCH_PATH = 'x11-packages/chromium-host-tools/jumbo-patches/0107-components.patch'
          OLD_PATCH = 'c2522ea5f9993376ac273a52ed69828f3630722a731a79940ad10bf41139e5ec'
          NEW_PATCH = '17a197a19a4ef14de28be34481374513a2c1159c231630d5f0035b609238fc43'
          DELTA = '9db927b5daf7d02648ccf4a3dcd2e5a17baf62f8175b10dd795a54f5606172d4'
          REPAIRED_BROWSER = '5394835fb80f7d34798eae4eabf276116f7b1a5a00beccb17579f789c22ba101'
          REPAIRED_HOST = '36c6fb4a1b48e71874d849cc0a5ff53e3a9f7a315d5d6f237866746947bbaa12'
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          def apply(root, inputs):
              root, inputs = Path(root).resolve(), Path(inputs).resolve()
              assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip() == BASE
              patch_path = root / PATCH_PATH
              original = patch_path.read_bytes()
              delta = (inputs / 'upstream-components-backport.patch').read_bytes()
              assert len(original) == 108148 and sha(original) == OLD_PATCH
              assert len(delta) == 530 and delta.count(b'\n') == 17 and sha(delta) == DELTA
              updated = original + delta
              assert len(updated) == 108678 and sha(updated) == NEW_PATCH
              browser_path = root / 'x11-packages/chromium/build.sh'
              browser = browser_path.read_bytes()
              host = (root / 'x11-packages/chromium-host-tools/build.sh').read_bytes()
              assert sha(browser) == REPAIRED_BROWSER and sha(host) == REPAIRED_HOST
              before = '\t# Apply patches for jumbo build\n'
              after = '\t# Use some system libs\n'
              text = browser.decode()
              assert text.count(before) == text.count(after) == 1
              def guard(stage):
                  return ('\t/usr/bin/python3 "$TERMUX_SCRIPTDIR/maintenance/chromium158/verify-components-source.py" '
                          + stage + ' "$TERMUX_PKG_SRCDIR" > '
                          '"$TERMUX_SCRIPTDIR/output/maintenance-diagnostics/chromium/components-source-'
                          + stage + '.json"\n\n')
              text = text.replace(before, guard('before') + before, 1)
              text = text.replace(after, guard('after') + after, 1)
              subprocess.run(['bash', '-n'], input=text, text=True, check=True)
              helper = (inputs / 'verify-components-source.py').read_bytes()
              compile(helper, 'verify-components-source.py', 'exec')
              destination = root / 'maintenance/chromium158/verify-components-source.py'
              assert not destination.exists()
              # Every identity and shell check above completes before any source mutation.
              patch_path.write_bytes(updated)
              browser_path.write_text(text)
              destination.write_bytes(helper)
              assert (root / 'x11-packages/chromium-host-tools/build.sh').read_bytes() == host
              return {'status': 'OFFICIAL_COMPONENTS_BACKPORT_APPLIED_NOT_BUILT',
                      'base_source_commit': BASE, 'official_patch_commit': OFFICIAL,
                      'patch_path': PATCH_PATH, 'old_patch_sha256': OLD_PATCH,
                      'new_patch_sha256': NEW_PATCH, 'delta_bytes': len(delta),
                      'delta_lines': 17, 'delta_sha256': DELTA,
