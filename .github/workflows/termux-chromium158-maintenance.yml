          with (root/expected).open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==m['deb_sha256']
          assert {p.name for p in root.iterdir()}=={expected,'manifest.json'}
          subprocess.run(['cp','--no-clobber',str(root/expected),'output/'+expected],check=True)
          Path('output/maintenance-diagnostics/host-tools-input.json').write_text(json.dumps({'deb_sha256':m['deb_sha256'],'manifest_sha256':hashlib.sha256((root/'manifest.json').read_bytes()).hexdigest(),'package':m['package']},indent=2)+'\n')
          PY
          fi
          export NINJA_STATUS='[%f/%t %e sec] '
          # A controlled limit leaves time for diagnostic and package upload before the six-hour job ceiling.
          set +e
          timeout --signal=TERM --kill-after=45s 19500 ./build-package.sh -I -j4 --format debian --reuse-built-packages -a aarch64 "$package" 2>&1 | tee output/maintenance-diagnostics/build.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > output/maintenance-diagnostics/build.exit-code
          if test "$rc" -ne 0; then exit "$rc"; fi
          deb="output/${package}_158.0.8127.36-0~termuxlocal1_aarch64.deb"
          test -f "$deb"
          cp "$deb" output/delivery/
          /usr/bin/python3 maintenance/chromium158/package-manifest.py create "output/delivery/$(basename "$deb")" output/delivery/manifest.json "$package" > output/maintenance-diagnostics/package-verification.json
          if test "$stage" = browser; then
            /usr/bin/python3 maintenance/chromium158/package-manifest.py verify-host-tools output/host-tools-input/manifest.json /data/data/com.termux/files/usr /data/data/.built-packages/chromium-host-tools > output/maintenance-diagnostics/chromium/installed-host-tools-after-build.json
          fi
          sha256sum output/delivery/* > output/maintenance-diagnostics/delivery.sha256
          cat output/maintenance-diagnostics/package-verification.json
