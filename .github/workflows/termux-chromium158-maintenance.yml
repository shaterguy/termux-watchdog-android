                      'exact_cipd_python_recovery_preserved': True,
                      'source_before_and_after_hash_checks_inserted': True,
                      'new_source_guard_sha256': sha(helper)}
          
          if __name__ == '__main__':
              assert len(sys.argv) == 2
              print(json.dumps(apply(sys.argv[1], Path(__file__).resolve().parent), indent=2))
