      - name: Start the fixed builder before applying the official ephemeral cleanup
        shell: bash
        working-directory: termux-packages
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker pull --platform linux/amd64 "$TERMUX_BUILDER_IMAGE_NAME"
          CI=true ./scripts/run-docker.sh /bin/bash -lc 'set -euo pipefail; uname -m; /usr/bin/python3 --version; dpkg --version' > ../diagnostic/container-toolchain.txt 2>&1
          docker inspect "$CONTAINER_NAME" --format '{{json .Config.Image}}' > ../diagnostic/container-image.json
          CI=true ./scripts/free-space.sh > ../diagnostic/ephemeral-space-cleanup.log 2>&1
          test "$(docker inspect "$CONTAINER_NAME" --format '{{.State.Running}}')" = true
      - name: Install the compiler-cache tool inside the disposable builder only
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$CONTAINER_NAME" /bin/bash -lc '
            set -euo pipefail
            if ! command -v ccache >/dev/null; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y ccache
            fi
            command -v ccache
            ccache --version
            dpkg-query -W -f="\${Package} \${Version}\n" ccache
          ' > diagnostic/ccache-package.txt 2>&1
      - name: Restore this stage's bounded compiler cache
        id: native-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: termux-packages/maintenance-ccache
          key: native-chromium158-07f9482c-e2de051a-host-tools-ccache-v1

      - name: Reserve job-local swap and verify this fresh runner's remaining capacity
        shell: bash
        run: |
          set -euo pipefail
          swapfile="$RUNNER_TEMP/chromium158-maintenance.swap"
          test ! -e "$swapfile"
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" > diagnostic/swap-setup.txt
          sudo swapon "$swapfile"
          swapon --show --bytes >> diagnostic/swap-setup.txt
          free -b > diagnostic/memory-before-build.txt
          df -B1 -a > diagnostic/df-before-build.txt
          lsblk -b -J -o NAME,PATH,SIZE,TYPE,FSTYPE,MOUNTPOINTS > diagnostic/lsblk-before-build.json
          disk_available=$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')
          memory_total=$(awk '/^MemTotal:/ { printf "%.0f", $2 * 1024 }' /proc/meminfo)
          cpu_count=$(nproc)
          jq -n --argjson disk "$disk_available" --argjson memory "$memory_total" --argjson cpu "$cpu_count" \
            '{disk_available_bytes:$disk,memory_total_bytes:$memory,cpu_count:$cpu,minimum_disk_bytes:100000000000,swap_bytes:17179869184,environment_guard:($disk>=100000000000 and $memory>=8000000000 and $cpu>=2)}' > diagnostic/build-environment.json
          jq -e '.environment_guard' diagnostic/build-environment.json
      - name: Compile and verify the exact local package
        shell: bash
        working-directory: termux-packages
        run: |
          set -euo pipefail
          CI=true ./scripts/run-docker.sh /usr/bin/env NATIVE_CCACHE_RESTORED="${{ steps.native-cache.outputs.cache-hit }}" /bin/bash /home/builder/termux-packages/maintenance-inputs/build-stage.sh host-tools 2>&1 | tee ../diagnostic/container-build.log
      - name: Preserve only the verified package and its complete payload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium158-host-tools-${{ github.run_id }}
          path: termux-packages/output/delivery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Collect build diagnostics and verify the bounded compiler checkpoint
        if: always()
        id: cache-checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          if test -d termux-packages/output/maintenance-diagnostics; then
            cp -a termux-packages/output/maintenance-diagnostics/. diagnostic/
          fi
          df -B1 -a > diagnostic/df-after-build.txt
          free -b > diagnostic/memory-after-build.txt
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            if docker exec "$CONTAINER_NAME" test -d /home/builder/termux-packages/maintenance-ccache; then
              docker exec --env CCACHE_DIR=/home/builder/termux-packages/maintenance-ccache --env CCACHE_MAXSIZE=1900MB "$CONTAINER_NAME" /usr/bin/ccache --cleanup
              docker exec --env CCACHE_DIR=/home/builder/termux-packages/maintenance-ccache "$CONTAINER_NAME" /usr/bin/ccache --show-stats --verbose > diagnostic/ccache-final.txt
              cache_bytes=$(du -sb termux-packages/maintenance-ccache | cut -f1)
              test "$cache_bytes" -le 2000000000
              jq -n --argjson bytes "$cache_bytes" '{cache_bytes:$bytes,max_bytes:2000000000,kind:"C/C++ compiler results only",complete_build_tree:false}' > diagnostic/ccache-checkpoint.json
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Remove only this job's temporary container and swap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker inspect "$CONTAINER_NAME" --format '{{json .State}}' > diagnostic/container-state-before-removal.json
            docker rm --force "$CONTAINER_NAME" > diagnostic/container-removal.txt
            if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then exit 1; fi
          fi
          swapfile="$RUNNER_TEMP/chromium158-maintenance.swap"
          if swapon --noheadings --show=NAME | grep -Fx -- "$swapfile" >/dev/null; then
            sudo swapoff "$swapfile"
          fi
          if test -f "$swapfile"; then sudo rm -- "$swapfile"; fi
          test ! -e "$swapfile"
          swapon --show --bytes > diagnostic/swap-after-cleanup.txt
      - name: Save the first bounded cache checkpoint even after a compilation failure
        if: always() && steps.cache-checkpoint.outputs.ready == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: termux-packages/maintenance-ccache
          key: native-chromium158-07f9482c-e2de051a-host-tools-ccache-v1

      - name: Preserve build logs even when compilation or validation failed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium158-host-tools-diagnostics-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: host-tools
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      PACKAGING_COMMIT: 07f9482c02535417719d7f6398f649d4bc176a1c
