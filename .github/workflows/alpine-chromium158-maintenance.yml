name: Build Alpine Chromium 158 on the verified ARM64 runner

on:
  push:
    branches:
      - maintenance/20261121-alpine-chromium158-builder
    paths:
      - .github/workflows/alpine-chromium158-maintenance.yml

permissions:
  contents: read

concurrency:
  group: alpine-chromium158-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'shaterguy/termux-watchdog-android' && github.event_name == 'push' && github.ref == 'refs/heads/maintenance/20261121-alpine-chromium158-builder'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ALPINE_IMAGE: docker.io/library/alpine@sha256:1829893486be257df5049ab3b7fc95afbd0fc09d89803cbc580bda1ba5386b29
      ALPINE_IMAGE_ID: sha256:abbc135a7d3909a5eb6a56aac4c769cf15be025e3c9e226b8660f2b2b378158b
      BUILD_CONTAINER: alpine-chromium158-native-build
      MINIMUM_FREE_BYTES: '100000000000'
    steps:
      - name: Retain the verified ARM64 environment and one-job time budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/evidence delivery/logs build-state/inputs build-state/scripts build-state/ccache
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          test "$(nproc)" -ge 4
          memory=$(awk '/^MemTotal:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)
          test "$memory" -ge 16000000000
          deadline=$(( $(date +%s) + 335 * 60 ))
          printf 'BUILD_DEADLINE_EPOCH=%s\n' "$deadline" >> "$GITHUB_ENV"
          jq -n --argjson deadline "$deadline" --argjson memory "$memory" --arg commit "$GITHUB_SHA" \
            '{workflow_commit:$commit,deadline_epoch:$deadline,job_limit_minutes:360,work_budget_minutes:335,reserved_finalization_minutes:25,ninja_jobs:4,cargo_jobs:4,go_jobs:4,memory_total_bytes:$memory,minimum_memory_bytes:16000000000,ccache_max_bytes:5000000000}' > delivery/evidence/run-budget.json
          {
            date -u +%FT%TZ
            uname -a
            nproc
            awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/ { print }' /proc/meminfo
            df -B1 --output=source,size,used,avail,target / "$GITHUB_WORKSPACE"
            docker version --format '{{.Server.Version}}'
          } > delivery/evidence/host-before.txt

      - name: Materialize the reviewed public-input manifest and build driver
