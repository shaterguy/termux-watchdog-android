          import base64
          import concurrent.futures
          import datetime
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import shlex
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import tarfile
          import time

          ROOT = Path('/build')
          OUT = Path('/artifacts')
          VERSION = '158.0.8127.36-r0'
          APORTS = '2116874b4e60aff6f0793aeecf4cf3d1b66fa2a6'
          ORIGINAL = '5affab4174bdf342b97b5fe5e87ec7dc6c29ca1644d18f08fca845bc5cf30ee6'
          PRIVATE = Path('/run/maintenance-signing/chromium158-maintenance.rsa')
          COMMIT = os.environ['ABUILD_LAST_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', COMMIT)
          for directory in ('evidence', 'logs', 'recipe/upstream', 'recipe/build', 'keys', 'packages'):
              (OUT / directory).mkdir(parents=True, exist_ok=True)
          for directory in ('rawlogs', 'sourcecache', 'recipe/upstream', 'recipe/chromium', 'packages'):
              (ROOT / directory).mkdir(parents=True, exist_ok=True)

          def sha(path, algorithm='sha256'):
              with Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream, algorithm).hexdigest()

          def write_json(path, value):
              temporary = Path(str(path) + '.tmp')
              temporary.write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
              temporary.replace(path)

          def now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          def secrets_to_remove():
              path = ROOT / 'recipe/upstream/google-api.keys'
              if not path.exists():
                  return []
              encoded = path.read_text().strip()
              decoded = base64.b64decode(encoded).decode()
              values = [encoded, decoded.strip()]
              for word in shlex.split(decoded, comments=True):
                  if word.startswith('_google_') and '=' in word:
                      value = word.split('=', 1)[1]
                      if len(value) >= 8:
                          values.append(value)
              return sorted(set(values), key=len, reverse=True)

          def sanitize(text):
              for value in secrets_to_remove():
                  text = text.replace(value, '[REDACTED_DISTRIBUTOR_CONFIG]')
              return text

          def export_log(name):
              path = ROOT / 'rawlogs' / (name + '.log')
              if not path.exists():
                  return
              raw = path.read_text(errors='replace')
              safe = sanitize(raw)
              target = OUT / 'logs' / path.name
              target.write_text(safe)
              write_json(OUT / 'evidence' / (name + '-log-identity.json'), {
                  'original_bytes': path.stat().st_size, 'original_sha256': sha(path),
                  'exported_bytes': target.stat().st_size, 'exported_sha256': sha(target),
                  'distributor_configuration_redacted': safe != raw,
              })

          def run(name, arguments, *, cwd=None, timeout=1800, environment=None):
              """Keep complete raw logs locally, export sanitized logs, and record every rc."""
              raw_path = ROOT / 'rawlogs' / (name + '.log')
              started = time.monotonic()
              record = {'name': name, 'started_utc': now(), 'arguments': arguments,
                        'workflow_commit': COMMIT, 'aports_commit': APORTS, 'status': 'RUNNING'}
              receipt = OUT / 'evidence' / ('stage-' + name + '.json')
              write_json(receipt, record)
              print(json.dumps({'stage': name, 'status': 'RUNNING'}), flush=True)
              process = subprocess.Popen(arguments, cwd=cwd, env=environment, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT, start_new_session=True)
              selector = selectors.DefaultSelector()
              selector.register(process.stdout, selectors.EVENT_READ)
              heartbeat = started
              interrupted = False
              progress_buffer = b''
              last_ninja_progress = None
              with raw_path.open('wb') as log:
                  while selector.get_map():
                      elapsed = time.monotonic() - started
                      if elapsed >= timeout and not interrupted:
                          interrupted = True
                          os.killpg(process.pid, signal.SIGINT)
                          record['timeout_seconds'] = timeout
                      if interrupted and elapsed >= timeout + 60:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                      for key, _ in selector.select(timeout=1):
                          data = os.read(key.fileobj.fileno(), 65536)
                          if data:
                              log.write(data)
                              log.flush()
                              progress_buffer += data
                              lines = progress_buffer.split(b'\n')
                              progress_buffer = lines.pop()[-8192:]
                              for line in lines:
                                  if re.fullmatch(rb'\[\d+/\d+\] (?:CXX|CC|AR|RUST|LINK|SOLINK) [A-Za-z0-9_./:+@%=-]+(?: [A-Za-z0-9_./:+@%=-]+)?\r?', line):
                                      last_ninja_progress = line.decode('ascii').strip()[:400]
                          else:
                              selector.unregister(key.fileobj)
                      if time.monotonic() - heartbeat >= 60:
                          print(json.dumps({'stage': name, 'elapsed_seconds': int(elapsed),
                                            'raw_log_bytes': log.tell(),
                                            'last_ninja_progress': sanitize(last_ninja_progress) if last_ninja_progress else None,
                                            'workspace_available_bytes': shutil.disk_usage(ROOT).free}), flush=True)
                          heartbeat = time.monotonic()
              selector.close()
              code = process.wait()
              record.update(status='DONE' if code == 0 and not interrupted else 'FAILED',
                            exit_code=code, controlled_timeout=interrupted, finished_utc=now(),
                            elapsed_seconds=round(time.monotonic() - started, 3))
              write_json(receipt, record)
              export_log(name)
              print(json.dumps(record), flush=True)
              if code != 0 or interrupted:
                  raise RuntimeError('stage_failed:' + name)

          def verify_inputs():
              recipes = json.loads((ROOT / 'inputs/RECIPE-GIT-BLOBS.json').read_text())
              sources = json.loads((ROOT / 'inputs/SOURCE-MANIFEST.json').read_text())
              assert len(recipes) == 23 and len(sources) == 26
              for item in recipes:
                  path = ROOT / 'recipe/upstream' / item['name']
                  assert path.is_file() and not path.is_symlink()
                  content = path.read_bytes()
                  blob = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  assert blob == item['sha'] and len(content) == item['size'], item['name']
              assert sha(ROOT / 'recipe/upstream/APKBUILD') == ORIGINAL
              for item in sources:
                  assert sha(ROOT / 'sourcecache' / item['name'], 'sha512') == item['sha512'], item['name']
              return recipes, sources

          def bootstrap():
              assert os.geteuid() == 0
              assert subprocess.check_output(['apk', '--print-arch'], text=True).strip() == 'aarch64'
              assert Path('/etc/alpine-release').read_text().strip() == '3.24.4'
              repos = Path('/etc/apk/repositories')
              assert sha(repos) == '7b8b3e6fe030eeb4ee7619b42c9419aa846bff1c632442d3f00ed9fb97c6fa36'
              recipes = json.loads((ROOT / 'inputs/RECIPE-GIT-BLOBS.json').read_text())
              sources = json.loads((ROOT / 'inputs/SOURCE-MANIFEST.json').read_text())
              for item in recipes:
                  name = item['name']
                  assert '/' not in name and name != '..'
                  expected_url = 'https://raw.githubusercontent.com/alpinelinux/aports/' + APORTS + '/community/chromium/' + name
                  assert item['url'] == expected_url
                  target = ROOT / 'recipe/upstream' / name
                  run('recipe-' + name, ['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3',
                      '--connect-timeout', '20', '--max-time', '180', '--output', str(target), expected_url], timeout=240)
                  content = target.read_bytes()
                  assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == item['sha'], name
                  assert len(content) == item['size'], name
                  shutil.copyfile(target, ROOT / 'recipe/chromium' / name)
              assert sha(ROOT / 'recipe/upstream/APKBUILD') == ORIGINAL
              deps = json.loads((ROOT / 'inputs/MAKEDEPENDS.json').read_text())
              derived = subprocess.check_output(['/bin/sh', '-c', 'CARCH=aarch64; . /build/recipe/upstream/APKBUILD; printf "%s\\n" $makedepends'], text=True).splitlines()
              assert derived == deps and len(deps) == 88
              run('dependencies', ['apk', 'add', '--no-cache', '--virtual', '.chromium158-builddeps'] +
                  deps + ['alpine-sdk', 'xvfb-run', 'ccache', 'python3', 'curl'], timeout=1800)
              assert sha(repos) == '7b8b3e6fe030eeb4ee7619b42c9419aa846bff1c632442d3f00ed9fb97c6fa36'
              shutil.copyfile(repos, OUT / 'evidence/repositories.txt')
              shutil.copyfile('/lib/apk/db/installed', OUT / 'evidence/installed-packages.db')
              shutil.copyfile('/etc/apk/world', OUT / 'evidence/world.txt')
              def download(item):
                  path = ROOT / 'sourcecache' / item['name']
                  if item['url']:
                      partial = Path(str(path) + '.part')
                      run('download-' + item['name'], ['curl', '--fail', '--location', '--retry', '3',
                          '--connect-timeout', '20', '--max-time', '1800', '--continue-at', '-',
                          '--output', str(partial), item['url']], timeout=1900)
                      assert sha(partial, 'sha512') == item['sha512'], item['name']
                      partial.replace(path)
                  else:
                      shutil.copyfile(ROOT / 'recipe/upstream' / item['name'], path)
                  assert sha(path, 'sha512') == item['sha512'], item['name']
                  return {'name': item['name'], 'url': item['url'], 'bytes': path.stat().st_size,
                          'sha512': item['sha512'], 'sha256': sha(path)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  verified = list(pool.map(download, sources))
              verify_inputs()
              write_json(OUT / 'evidence/sources-verified.json', {'count': len(verified), 'sources': verified})
              original = (ROOT / 'recipe/upstream/APKBUILD').read_text()
              needle = '\tninja -C out/bld \\\n'
              assert original.count(needle) == 1
              adapted = original.replace(needle, '\tninja -j4 -C out/bld \\\n')
              (ROOT / 'recipe/chromium/APKBUILD').write_text(adapted)
              package_identity = []
              for paragraph in Path('/lib/apk/db/installed').read_text().split('\n\n'):
                  fields = dict(line.split(':', 1) for line in paragraph.splitlines() if ':' in line)
                  if fields.get('P') and fields['P'] != '.chromium158-builddeps':
                      package_identity.append({key: fields.get(key, '') for key in ('P', 'V', 'A', 'C')})
              package_identity.sort(key=lambda item: item['P'])
              cache_contract = {'aports_commit': APORTS, 'upstream_recipe_sha256': ORIGINAL,
                  'active_recipe_sha256': sha(ROOT / 'recipe/chromium/APKBUILD'),
                  'package_identity_P_V_A_C': package_identity,
                  'compiler_settings': {'ninja_jobs': 4, 'cargo_jobs': 4, 'go_jobs': 4,
                      'USE_CCACHE': '1', 'CCACHE_COMPILERCHECK': 'content', 'CCACHE_BASEDIR': '/build'}}
              normalized = json.dumps(cache_contract, sort_keys=True, separators=(',', ':')).encode()
              cache_fingerprint = hashlib.sha256(normalized).hexdigest()
              write_json(OUT / 'evidence/cache-identity.json', {'fingerprint': cache_fingerprint,
                  'normalized_contract': cache_contract, 'excluded_task_virtual_package': '.chromium158-builddeps'})
              (OUT / 'evidence/cache-fingerprint.txt').write_text(cache_fingerprint + '\n')
              (OUT / 'recipe/concurrency.patch').write_text(''.join(difflib.unified_diff(
                  original.splitlines(True), adapted.splitlines(True), fromfile='upstream/APKBUILD', tofile='build/APKBUILD')))
              for item in recipes:
                  if item['name'] == 'google-api.keys':
                      continue
                  shutil.copyfile(ROOT / 'recipe/upstream' / item['name'], OUT / 'recipe/upstream' / item['name'])
                  shutil.copyfile(ROOT / 'recipe/chromium' / item['name'], OUT / 'recipe/build' / item['name'])
              for name in ('RECIPE-GIT-BLOBS.json', 'SOURCE-MANIFEST.json', 'MAKEDEPENDS.json'):
                  shutil.copyfile(ROOT / 'inputs' / name, OUT / 'evidence' / name)
              shutil.copyfile(__file__, OUT / 'evidence/build-driver.py')
              write_json(OUT / 'evidence/input-contract.json', {
                  'aports_commit': APORTS, 'workflow_commit': COMMIT,
                  'upstream_apkbuild_sha256': ORIGINAL, 'active_apkbuild_sha256': sha(ROOT / 'recipe/chromium/APKBUILD'),
                  'recipe_files_verified': 23, 'source_files_sha512_verified': 26,
                  'only_recipe_delta': 'ninja -j4; official features, check targets and package splits retained',
                  'distributor_api_configuration_exported': False,
                  'external_source_archives': 'Verified against pinned official recipe; originals remain at recorded upstream URLs and on the tablet.',
              })
              run('create-builder', ['adduser', '-D', '-u', '1000', '-G', 'abuild', '-h', '/home/builder', 'builder'], timeout=30)
              run('workspace-ownership', ['chown', '-R', '1000:1000', '/build', '/artifacts', '/ccache', '/run/maintenance-signing'], timeout=120)
              print(json.dumps({'bootstrap': 'VERIFIED', 'source_count': 26, 'recipe_count': 23}), flush=True)

          def environment():
              values = dict(os.environ, HOME='/home/builder', APKBUILD='/build/recipe/chromium/APKBUILD',
                  SRCDEST='/build/sourcecache', REPODEST='/build/packages', JOBS='4', MAKEFLAGS='-j4',
                  CARGO_BUILD_JOBS='4', GOMAXPROCS='4', SAMUFLAGS='-j4', CMAKE_BUILD_PARALLEL_LEVEL='4',
                  SOURCE_DATE_EPOCH='1795181522', PACKAGER='Isolated Alpine maintenance build <local@localhost>',
                  PACKAGER_PRIVKEY=str(PRIVATE), USE_CCACHE='1', CCACHE_DIR='/ccache',
                  CCACHE_BASEDIR='/build', CCACHE_COMPILERCHECK='content', CCACHE_MAXSIZE='5G',
                  XDG_CONFIG_HOME='/build/verification-config', XDG_CACHE_HOME='/build/verification-cache')
              if os.environ.get('CACHE_RESTORED') == 'true':
                  values['CCACHE_READONLY'] = 'true'
              else:
                  values.pop('CCACHE_READONLY', None)
              return values

          def package_check():
              keys = OUT / 'keys'
              public = keys / (PRIVATE.name + '.pub')
              records = []
              for path in sorted((ROOT / 'packages').rglob('*.apk')):
                  result = subprocess.run(['apk', '--keys-dir', str(keys), 'verify', str(path)], capture_output=True, text=True, timeout=180)
                  assert result.returncode == 0, path.name
                  metadata, signatures = {}, []
                  with tarfile.open(path, mode='r|gz', ignore_zeros=True) as archive:
                      for member in archive:
                          name = member.name.removeprefix('./')
                          if name.startswith('.SIGN.'):
                              signatures.append(name)
                          if name == '.PKGINFO':
                              assert member.isfile(), 'Package metadata must be a regular file'
                              for line in archive.extractfile(member).read().decode().splitlines():
                                  if ' = ' in line and not line.startswith('#'):
                                      key, value = line.split(' = ', 1)
                                      metadata.setdefault(key, []).append(value)
                              break
                  name = metadata['pkgname'][0]
                  assert re.fullmatch(r'chromium(?:-[a-z0-9-]+)?', name)
                  assert metadata['pkgver'] == [VERSION] and metadata['arch'] in [['aarch64'], ['noarch']]
                  if name in ('chromium', 'chromium-angle'):
                      assert metadata['arch'] == ['aarch64']
                  assert metadata['commit'] == [COMMIT]
                  assert path.name == name + '-' + VERSION + '.apk'
                  assert len(signatures) == 1 and signatures[0] in ['.SIGN.RSA.' + public.name, '.SIGN.RSA256.' + public.name]
                  destination = OUT / 'packages' / path.name
                  shutil.copyfile(path, destination)
                  records.append({'name': name, 'version': VERSION, 'bytes': path.stat().st_size,
                      'sha256': sha(path), 'apk_signature_verified': True, 'metadata': metadata, 'signatures': signatures})
              assert {'chromium', 'chromium-common', 'chromium-angle'}.issubset({x['name'] for x in records})
              for index in sorted((ROOT / 'packages').rglob('APKINDEX.tar.gz')):
                  shutil.copyfile(index, OUT / 'packages/APKINDEX.tar.gz')
              write_json(OUT / 'evidence/packages-verified.json', {'status': 'VERIFIED', 'packages': records,
                  'workflow_commit': COMMIT, 'public_key_sha256': sha(public), 'target_device_installed': False})

          def build():
              assert os.geteuid() == 1000
              verify_inputs()
              contract = json.loads((OUT / 'evidence/input-contract.json').read_text())
              assert sha(ROOT / 'recipe/chromium/APKBUILD') == contract['active_apkbuild_sha256']
              env = environment()
              write_json(OUT / 'evidence/cache-policy.json', {'max_size_decimal_bytes': 5000000000,
                  'exact_snapshot_restored': os.environ.get('CACHE_RESTORED') == 'true',
                  'read_only_on_exact_restore': os.environ.get('CACHE_RESTORED') == 'true',
                  'cache_scope': 'C/C++ compiler outputs; Rust builds, Ninja graph and final links are not resumed by this cache',
                  'save_policy': 'First failed-build snapshot only, fixed maintenance/source/compiler/stage key',
                  'automatic_repository_cache_deletion': False})
              # The host sets this once at job start; preserve 25 minutes for cleanup/cache/upload.
              deadline = int(os.environ['BUILD_DEADLINE_EPOCH'])
              commands = {'prepare': ['validate', 'unpack', 'prepare'], 'build': ['build'],
                          'check': ['check'], 'package': ['rootpkg', 'index']}
              for stage, actions in commands.items():
                  remaining = deadline - time.time()
                  assert remaining > 120, 'insufficient_time_before_' + stage
                  if stage == 'package':
                      assert all(json.loads((OUT / 'evidence' / ('stage-' + prior + '.json')).read_text())['status'] == 'DONE'
                                 for prior in ('prepare', 'build', 'check'))
                      PRIVATE.parent.chmod(0o700)
                      old_umask = os.umask(0o077)
                      try:
                          subprocess.run(['openssl', 'genrsa', '-out', str(PRIVATE), '4096'], check=True, capture_output=True)
                          subprocess.run(['openssl', 'rsa', '-in', str(PRIVATE), '-pubout', '-out', str(PRIVATE) + '.pub'], check=True, capture_output=True)
                      finally:
                          os.umask(old_umask)
                      public = Path(str(PRIVATE) + '.pub')
                      shutil.copyfile(public, OUT / 'keys' / public.name)
                      (OUT / 'keys' / public.name).chmod(0o644)
                      write_json(OUT / 'evidence/signing.json', {'public_key_name': public.name,
                          'public_key_sha256': sha(public), 'private_key_exported': False,
                          'global_trust_modified': False, 'private_key_location': 'ephemeral_container_tmpfs'})
                  run(stage, ['abuild', '-K', '-m', '-P', '/build/packages', '-s', '/build/sourcecache'] + actions,
                      cwd='/build/recipe/chromium', timeout=int(remaining), environment=env)
              package_check()
              binary = ROOT / 'recipe/chromium/src/chromium-158.0.8127.36/out/bld/chrome'
              run('compiled-version', [str(binary), '--version'], environment=env, timeout=60)
              run('compiled-elf', ['readelf', '-h', str(binary)], environment=env, timeout=60)
              assert 'Chromium 158.0.8127.36' in (OUT / 'logs/compiled-version.log').read_text()
              assert re.search(r'Machine:\s+AArch64', (OUT / 'logs/compiled-elf.log').read_text())
              write_json(OUT / 'evidence/final-result.json', {'status': 'BUILT_CHECKED_SIGNED_VERIFIED',
                  'workflow_commit': COMMIT, 'aports_commit': APORTS, 'package_version': VERSION,
                  'original_check_function_completed': True, 'device_installed': False, 'completed_utc': now()})

          def finalize():
              for path in (ROOT / 'rawlogs').glob('*.log'):
                  export_log(path.stem)
              if PRIVATE.exists():
                  PRIVATE.unlink()
              public = Path(str(PRIVATE) + '.pub')
              if public.exists():
                  public.unlink()
              assert not PRIVATE.exists()
              run('ccache-stats', ['ccache', '--show-stats'], environment=environment(), timeout=60)
              # Explicitly enumerate output files; the source tree, args.gn and signing tmpfs are outside this export.
              manifest = []
              for path in sorted(OUT.rglob('*')):
                  if path.is_file() and path.name != 'MANIFEST.json':
                      assert not path.is_symlink() and stat.S_ISREG(path.stat().st_mode)
                      assert path.name not in ('google-api.keys', 'args.gn', PRIVATE.name)
                      if path.suffix in ('.json', '.log', '.txt', '.py', '.patch', '.sh', '.pub') or path.name == 'APKBUILD':
                          data = path.read_text(errors='replace')
                          assert not re.search(r'^-----BEGIN (?:RSA )?PRIVATE KEY-----\r?$', data, re.MULTILINE)
                          for secret in secrets_to_remove():
                              assert secret not in data
                      manifest.append({'path': str(path.relative_to(OUT)), 'bytes': path.stat().st_size, 'sha256': sha(path)})
              write_json(OUT / 'MANIFEST.json', {'files': manifest, 'private_key_absent': True,
                  'distributor_configuration_not_exported': True, 'workflow_commit': COMMIT})

          if __name__ == '__main__':
              mode = sys.argv[1]
              if mode == 'bootstrap':
                  bootstrap()
              elif mode == 'build':
                  try:
                      build()
                  except BaseException as error:
                      write_json(OUT / 'evidence/driver-failure.json', {'status': 'FAILED', 'type': type(error).__name__,
                          'message': sanitize(str(error)), 'time_utc': now(), 'workflow_commit': COMMIT})
                      raise
                  finally:
                      finalize()
              elif mode == 'finalize':
                  finalize()
              else:
                  raise SystemExit('unsupported_mode')
          BUILD_DRIVER_PY
          sha256sum build-state/scripts/build.py build-state/inputs/*.json > delivery/evidence/embedded-inputs.sha256

      - name: Bootstrap the pinned stable Alpine container
        id: bootstrap
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$ALPINE_IMAGE" > delivery/logs/image-pull.log 2>&1
          test "$(docker image inspect "$ALPINE_IMAGE" --format '{{.Id}}')" = "$ALPINE_IMAGE_ID"
          test "$(docker image inspect "$ALPINE_IMAGE" --format '{{.Architecture}} {{.Os}}')" = 'arm64 linux'
          docker image inspect "$ALPINE_IMAGE" | jq 'map({Id,RepoDigests,Architecture,Os,Size})' > delivery/evidence/image-identity.json
          docker run --detach --name "$BUILD_CONTAINER" --platform linux/arm64 --shm-size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE/build-state",target=/build \
            --mount type=bind,source="$GITHUB_WORKSPACE/build-state/ccache",target=/ccache \
            --mount type=bind,source="$GITHUB_WORKSPACE/delivery",target=/artifacts \
            --tmpfs /run/maintenance-signing:rw,noexec,nosuid,size=1m,mode=0700 \
            --env ABUILD_LAST_COMMIT="$GITHUB_SHA" --env BUILD_DEADLINE_EPOCH="$BUILD_DEADLINE_EPOCH" \
            "$ALPINE_IMAGE" /bin/sh -c 'while :; do sleep 3600; done' > delivery/evidence/container-id.txt
          # Reuse the preflight's exact optional SDK scope. Do not touch Docker/containerd state.
          : > delivery/evidence/ephemeral-cleanup.jsonl
          for candidate in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /opt/az; do
            available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
            if (( available >= MINIMUM_FREE_BYTES )); then break; fi
            if [[ ! -d "$candidate" || -L "$candidate" ]] || mountpoint -q "$candidate"; then continue; fi
            test "$(realpath -e -- "$candidate")" = "$candidate"
            before_kib=$(sudo du -sk -- "$candidate" | awk '{print $1}')
            sudo rm -rf --one-file-system -- "$candidate"
            test ! -e "$candidate"
            jq -nc --arg path "$candidate" --argjson kib "$before_kib" '{path:$path,before_du_kib:$kib,removed:true}' >> delivery/evidence/ephemeral-cleanup.jsonl
          done
          available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          test "$available" -ge "$MINIMUM_FREE_BYTES"
          docker exec "$BUILD_CONTAINER" /bin/sh -c 'set -eu; test "$(uname -m)" = aarch64; test "$(apk --print-arch)" = aarch64; test "$(cat /etc/alpine-release)" = 3.24.4; apk add --no-cache python3 curl ccache alpine-sdk' > delivery/logs/bootstrap-tools.log 2>&1
          docker exec "$BUILD_CONTAINER" python3 /build/scripts/build.py bootstrap
          fingerprint=$(cat delivery/evidence/cache-fingerprint.txt)
          test "${#fingerprint}" -eq 64
          printf 'cache_fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Restore only the matching native compiler cache
        id: compiler-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-state/ccache
          key: maintenance-20261121-alpine-chromium158-aarch64-compile-${{ steps.bootstrap.outputs.cache_fingerprint }}

      - name: Run original preparation, build, checks and signed packaging
        id: native-build
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$BUILD_CONTAINER" chown -R 1000:1000 /ccache
          # Native Alpine, normal build user. The internal deadline leaves time for evidence and cache export.
          docker exec --user 1000:1000 --env HOME=/home/builder --env CACHE_RESTORED='${{ steps.compiler-cache.outputs.cache-hit }}' "$BUILD_CONTAINER" python3 /build/scripts/build.py build
          test -s delivery/evidence/packages-verified.json
          test -s delivery/evidence/final-result.json

      - name: Preserve logs and destroy the ephemeral signing key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          finalize_rc=0
          removal_rc=0
          if docker inspect "$BUILD_CONTAINER" >/dev/null 2>&1; then
            if docker exec "$BUILD_CONTAINER" test -x /usr/bin/python3; then
              docker exec "$BUILD_CONTAINER" python3 /build/scripts/build.py finalize || finalize_rc=$?
            fi
            docker exec "$BUILD_CONTAINER" /bin/sh -c 'rm -f /run/maintenance-signing/chromium158-maintenance.rsa /run/maintenance-signing/chromium158-maintenance.rsa.pub; test ! -e /run/maintenance-signing/chromium158-maintenance.rsa' || removal_rc=$?
            docker inspect "$BUILD_CONTAINER" --format '{{json .State}}' > delivery/evidence/container-state-before-removal.json || removal_rc=$?
            docker rm --force "$BUILD_CONTAINER" > delivery/evidence/container-removal.txt || removal_rc=$?
            if docker inspect "$BUILD_CONTAINER" >/dev/null 2>&1; then removal_rc=1; fi
          fi
          if (( finalize_rc != 0 )); then
            # A failed export check must not publish the unverified output directory.
            mv delivery blocked-delivery
            mkdir -p delivery/evidence
            jq -n --argjson code "$finalize_rc" '{status:"EXPORT_VALIDATION_FAILED",exit_code:$code,unverified_output_quarantined:true}' > delivery/evidence/export-failure.json
          fi
          df -B1 --output=source,size,used,avail,target / "$GITHUB_WORKSPACE" > delivery/evidence/host-final-space.txt
          find delivery -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > delivery/CHECKSUMS.sha256
          test "$finalize_rc" -eq 0
          test "$removal_rc" -eq 0

      - name: Preserve successful and failed build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpine-chromium158-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Save bounded partial compiler work for an informed continuation
        if: always() && steps.bootstrap.outputs.ready == 'true' && steps.native-build.outcome != 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-state/ccache
          key: maintenance-20261121-alpine-chromium158-aarch64-compile-${{ steps.bootstrap.outputs.cache_fingerprint }}
